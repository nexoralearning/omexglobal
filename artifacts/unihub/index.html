<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONEX GLOBAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #080808;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Ambient glow ── */
    #glow {
      position: absolute;
      width: 70vw; height: 70vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      will-change: opacity, transform;
    }

    /* ── Grid texture ── */
    #grid {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.18) 1px, transparent 1px);
      background-size: 4vw 4vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease;
    }

    /* ── Cinematic border lines ── */
    .vline {
      position: absolute; top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.06);
      transform: scaleY(0);
      transition: transform 2s ease;
    }
    #vl { left: 4vw; transform-origin: top center; }
    #vr { right: 4vw; transform-origin: bottom center; }

    /* ── Main lockup ── */
    #lockup {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      opacity: 0;
      transform: scale(0.94);
      will-change: opacity, transform;
    }

    /* ── Logo icon (the PNG, cropped to top half via clip-path) ── */
    #icon-wrap {
      position: relative;
      width: 24vw; height: 13vw;
      overflow: hidden;
      margin-bottom: 2.5vw;
      opacity: 0;
      filter: blur(20px);
      transform: scale(0.82) translateY(1.5vw);
      will-change: opacity, filter, transform;
    }

    #icon-wrap img {
      position: absolute;
      top: 0; left: 50%;
      width: 120%;
      transform: translateX(-50%) scale(1.2);
      mix-blend-mode: screen;
      /* clip top 50% of the image — isolates the icon, hides the original text */
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
    }

    /* ── Brand text ── */
    #text-block {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.4vw;
      text-align: center;
    }

    .brand-line {
      color: white;
      display: flex; justify-content: center;
      overflow: hidden;
    }

    #line-onex   { font-size: clamp(28px, 8vw, 120px); font-weight: 900; letter-spacing: -0.01em; line-height: 0.85; }
    #line-global {
      font-size: clamp(18px, 8vw, 120px); font-weight: 900;
      letter-spacing: 0.2em;
      line-height: 0.85;
      background: linear-gradient(to bottom, #ffffff, #888888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Characters ── */
    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(100%) rotateX(90deg);
      will-change: opacity, transform;
    }

    /* ── Footer ── */
    #footer {
      position: absolute;
      bottom: clamp(16px, 3.2vh, 44px);
      left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 clamp(20px, 4.4vw, 60px);
      opacity: 0;
      transition: opacity 1.1s ease;
    }
    #footer span {
      color: rgba(255,255,255,0.3);
      font-size: clamp(8px, 1.1vw, 14px);
      letter-spacing: 0.3em;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div class="vline" id="vl"></div>
  <div class="vline" id="vr"></div>

  <div id="lockup">
    <!-- Logo PNG — mix-blend-mode:screen strips the black bg; clip-path hides the original text -->
    <div id="icon-wrap">
      <img src="images/logo.png" alt="ONEX GLOBAL icon" />
    </div>

    <!-- ONEX GLOBAL staggered text -->
    <div id="text-block">
      <div class="brand-line" id="line-onex"></div>
      <div class="brand-line" id="line-global"></div>
    </div>
  </div>

  <div id="footer">
    <span>ONEX GLOBAL</span>
    <span>2025 – 2026</span>
  </div>
</div>

<script>
  const LOOP = 7000;

  function buildChars(el, text) {
    el.innerHTML = text.split('').map((c, i) =>
      `<span class="char" data-i="${i}">${c === ' ' ? '&nbsp;' : c}</span>`
    ).join('');
    return Array.from(el.querySelectorAll('.char'));
  }

  const onexChars   = buildChars(document.getElementById('line-onex'), 'ONEX');
  const globalChars = buildChars(document.getElementById('line-global'), 'GLOBAL');

  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  // Animate a single numeric CSS property over `dur` ms
  function animate(el, fromProps, toProps, duration, delay = 0) {
    setTimeout(() => {
      const start = performance.now();
      // set starting state
      applyProps(el, fromProps);
      requestAnimationFrame(function tick(now) {
        const t = Math.min((now - start) / duration, 1);
        const e = easeOut(t);
        // interpolate & apply
        const current = {};
        for (const k of Object.keys(toProps)) {
          const from = fromProps[k] ?? 0;
          const to = toProps[k];
          current[k] = from + (to - from) * e;
        }
        applyProps(el, current);
        if (t < 1) requestAnimationFrame(tick);
      });
    }, delay);
  }

  function applyProps(el, props) {
    if ('opacity' in props) el.style.opacity = props.opacity;
    const parts = [];
    if ('scale' in props)       parts.push(`scale(${props.scale})`);
    if ('translateY' in props)  parts.push(`translateY(${props.translateY}vw)`);
    if ('translateX' in props)  parts.push(`translateX(${props.translateX}%)`);
    if ('blur' in props)        el.style.filter = `blur(${props.blur}px)`;
    if (parts.length)           el.style.transform = parts.join(' ');
  }

  function animateChar(char, show, delay) {
    setTimeout(() => {
      char.style.transition = `opacity 0.8s cubic-bezier(0.16,1,0.3,1) , transform 0.8s cubic-bezier(0.16,1,0.3,1)`;
      char.style.opacity = show ? '1' : '0';
      char.style.transform = show ? 'translateY(0) rotateX(0deg)' : 'translateY(-100%) rotateX(-90deg)';
    }, delay);
  }

  function runLoop() {
    // ── Hard reset (no transitions) ──
    const lockup = document.getElementById('lockup');
    const iconWrap = document.getElementById('icon-wrap');
    const glow = document.getElementById('glow');
    const grid = document.getElementById('grid');
    const footer = document.getElementById('footer');

    lockup.style.transition = 'none';
    lockup.style.opacity = '0';
    lockup.style.transform = 'scale(0.94)';

    iconWrap.style.transition = 'none';
    iconWrap.style.opacity = '0';
    iconWrap.style.filter = 'blur(20px)';
    iconWrap.style.transform = 'scale(0.82) translateY(1.5vw)';

    glow.style.transition = 'none';
    glow.style.opacity = '0';
    glow.style.transform = 'translate(-50%,-50%) scale(0.6)';

    grid.style.opacity = '0';
    footer.style.opacity = '0';
    document.getElementById('vl').style.transform = 'scaleY(0)';
    document.getElementById('vr').style.transform = 'scaleY(0)';

    [...onexChars, ...globalChars].forEach(c => {
      c.style.transition = 'none';
      c.style.opacity = '0';
      c.style.transform = 'translateY(100%) rotateX(90deg)';
    });

    // ── Let reset paint, then animate ──
    requestAnimationFrame(() => requestAnimationFrame(() => {

      // 0.4s — glow swells, grid & lines appear, lockup container fades in
      setTimeout(() => {
        glow.style.transition = 'opacity 1.8s ease, transform 5s ease';
        glow.style.opacity = '0.9';
        glow.style.transform = 'translate(-50%,-50%) scale(1.3)';

        grid.style.transition = 'opacity 2s ease';
        grid.style.opacity = '1';

        document.getElementById('vl').style.transform = 'scaleY(1)';
        document.getElementById('vr').style.transform = 'scaleY(1)';

        lockup.style.transition = 'opacity 1.2s ease, transform 7s linear';
        lockup.style.opacity = '1';
        lockup.style.transform = 'scale(1.06)';
      }, 400);

      // 0.5s — icon emerges from blur
      setTimeout(() => {
        iconWrap.style.transition = 'opacity 1.2s cubic-bezier(0.16,1,0.3,1), filter 1.2s cubic-bezier(0.16,1,0.3,1), transform 1.2s cubic-bezier(0.16,1,0.3,1)';
        iconWrap.style.opacity = '1';
        iconWrap.style.filter = 'blur(0px)';
        iconWrap.style.transform = 'scale(1) translateY(0)';
      }, 500);

      // 1.5s — ONEX stagger in
      onexChars.forEach((c, i) => animateChar(c, true, 1500 + i * 55));

      // 2.0s — GLOBAL stagger in
      globalChars.forEach((c, i) => animateChar(c, true, 2000 + i * 50));

      // 2.8s — footer
      setTimeout(() => { footer.style.opacity = '1'; }, 2800);

      // 5.8s — outro: chars exit
      onexChars.forEach((c, i) => animateChar(c, false, 5800 + i * 20));
      globalChars.forEach((c, i) => animateChar(c, false, 5800 + i * 18));

      setTimeout(() => { footer.style.opacity = '0'; }, 5800);

      // 6.2s — icon + glow fade out
      setTimeout(() => {
        iconWrap.style.transition = 'opacity 0.6s ease, filter 0.6s ease, transform 0.6s ease';
        iconWrap.style.opacity = '0';
        iconWrap.style.filter = 'blur(20px)';
        iconWrap.style.transform = 'scale(0.9) translateY(-1vw)';

        glow.style.transition = 'opacity 0.8s ease';
        glow.style.opacity = '0';
        grid.style.transition = 'opacity 0.8s ease';
        grid.style.opacity = '0';
        document.getElementById('vl').style.transition = 'transform 0.8s ease';
        document.getElementById('vr').style.transition = 'transform 0.8s ease';
        document.getElementById('vl').style.transform = 'scaleY(0)';
        document.getElementById('vr').style.transform = 'scaleY(0)';
      }, 6200);
    }));
  }

  runLoop();
  setInterval(runLoop, LOOP);
</script>
</body>
</html>
