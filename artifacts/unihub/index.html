<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONEX GLOBAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #080808;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Ambient glow ── */
    #glow {
      position: absolute;
      width: 70vw; height: 70vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      will-change: opacity, transform;
    }

    /* ── Grid texture ── */
    #grid {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.18) 1px, transparent 1px);
      background-size: 4vw 4vw;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Cinematic border lines ── */
    .vline {
      position: absolute; top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.06);
      transform: scaleY(0);
    }
    #vl { left: 4vw;  transform-origin: top center; }
    #vr { right: 4vw; transform-origin: bottom center; }

    /* ── Main lockup ── */
    #lockup {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      opacity: 0;
      transform: scale(0.95);
      will-change: opacity, transform;
    }

    /* ── Logo icon (PNG, clipped to top half) ── */
    #icon-wrap {
      position: relative;
      width: 24vw; height: 13vw;
      overflow: hidden;
      margin-bottom: 2.5vw;
      opacity: 0;
      filter: blur(20px);
      transform: scale(0.82) translateY(1.5vw);
      will-change: opacity, filter, transform;
    }

    #icon-wrap img {
      position: absolute;
      top: 0; left: 50%;
      width: 120%;
      transform: translateX(-50%) scale(1.2);
      mix-blend-mode: screen;
      clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
    }

    /* ── Brand text ── */
    #text-block {
      display: flex; flex-direction: column;
      align-items: center; gap: 0.4vw;
      text-align: center;
    }

    /* perspective on each line so rotateX looks 3-D */
    .brand-line {
      color: white;
      display: flex; justify-content: center;
      perspective: 800px;
    }

    #line-onex {
      font-size: clamp(28px, 8vw, 120px);
      font-weight: 900;
      letter-spacing: -0.01em;
      line-height: 0.85;
    }
    #line-global {
      font-size: clamp(18px, 8vw, 120px);
      font-weight: 900;
      letter-spacing: 0.2em;
      line-height: 0.85;
      background: linear-gradient(to bottom, #ffffff, #888888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Character wrappers — clip the 3-D flip ── */
    .char-wrap {
      display: inline-block;
      overflow: hidden;           /* clips char as it slides up from below */
    }

    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(100%) rotateX(90deg);
      will-change: opacity, transform;
    }

    /* ── Footer ── */
    #footer {
      position: absolute;
      bottom: clamp(16px, 3.2vh, 44px);
      left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 clamp(20px, 4.4vw, 60px);
      opacity: 0;
    }
    #footer span {
      color: rgba(255,255,255,0.3);
      font-size: clamp(9px, 1.1vw, 14px);
      letter-spacing: 0.12em;
      font-weight: 400;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="glow"></div>
    <div id="grid"></div>
    <div class="vline" id="vl"></div>
    <div class="vline" id="vr"></div>

    <div id="lockup">
      <div id="icon-wrap">
        <img src="images/logo.png" alt="ONEX GLOBAL logo" />
      </div>

      <div id="text-block">
        <div class="brand-line" id="line-onex"></div>
        <div class="brand-line" id="line-global"></div>
      </div>
    </div>

    <div id="footer">
      <span>ONEX GLOBAL</span>
      <span>2025 – 2026</span>
    </div>
  </div>

  <script>
    const LOOP = 8000; // full cycle in ms
    const EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';

    // ── Build character elements ──────────────────────────────────────────────
    function buildChars(lineEl, text) {
      const chars = [];
      for (const char of text) {
        const wrap = document.createElement('span');
        wrap.className = 'char-wrap';

        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = char === ' ' ? '\u00A0' : char;

        wrap.appendChild(span);
        lineEl.appendChild(wrap);
        chars.push(span);
      }
      return chars;
    }

    const onexLine    = document.getElementById('line-onex');
    const globalLine  = document.getElementById('line-global');
    const onexChars   = buildChars(onexLine,   'ONEX');
    const globalChars = buildChars(globalLine, 'GLOBAL');

    // ── Animation helpers ─────────────────────────────────────────────────────
    function charIn(el, staggerDelay) {
      setTimeout(() => {
        el.style.transition = `opacity 0.8s ${EASE}, transform 0.8s ${EASE}`;
        el.style.opacity    = '1';
        el.style.transform  = 'translateY(0%) rotateX(0deg)';
      }, staggerDelay);
    }

    function charOut(el, delay) {
      setTimeout(() => {
        el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        el.style.opacity    = '0';
        el.style.transform  = 'translateY(-100%) rotateX(-90deg)';
      }, delay);
    }

    function resetChar(el) {
      el.style.transition = 'none';
      el.style.opacity    = '0';
      el.style.transform  = 'translateY(100%) rotateX(90deg)';
    }

    // ── DOM references ────────────────────────────────────────────────────────
    const glow     = document.getElementById('glow');
    const grid     = document.getElementById('grid');
    const vl       = document.getElementById('vl');
    const vr       = document.getElementById('vr');
    const lockup   = document.getElementById('lockup');
    const iconWrap = document.getElementById('icon-wrap');
    const footer   = document.getElementById('footer');

    // ── Reset all elements to initial hidden state ────────────────────────────
    function reset() {
      glow.style.transition    = 'none';
      glow.style.opacity       = '0';
      glow.style.transform     = 'translate(-50%, -50%) scale(0.6)';

      grid.style.transition    = 'none';
      grid.style.opacity       = '0';

      vl.style.transition      = 'none';
      vl.style.transform       = 'scaleY(0)';
      vr.style.transition      = 'none';
      vr.style.transform       = 'scaleY(0)';

      lockup.style.transition  = 'none';
      lockup.style.opacity     = '0';
      lockup.style.transform   = 'scale(0.95)';

      iconWrap.style.transition = 'none';
      iconWrap.style.opacity    = '0';
      iconWrap.style.filter     = 'blur(20px)';
      iconWrap.style.transform  = 'scale(0.82) translateY(1.5vw)';

      footer.style.transition  = 'none';
      footer.style.opacity     = '0';

      [...onexChars, ...globalChars].forEach(resetChar);
    }

    // ── One full cycle ────────────────────────────────────────────────────────
    function runLoop() {
      reset();

      // Double rAF ensures transition:none has been painted before re-adding transitions
      requestAnimationFrame(() => requestAnimationFrame(() => {

        // 400ms — env reveals; lockup fades in and begins slow drift upward
        setTimeout(() => {
          glow.style.transition = 'opacity 2s ease, transform 5s ease';
          glow.style.opacity    = '0.9';
          glow.style.transform  = 'translate(-50%, -50%) scale(1.3)';

          grid.style.transition = 'opacity 2s ease';
          grid.style.opacity    = '1';

          vl.style.transition   = 'transform 2s ease';
          vl.style.transform    = 'scaleY(1)';
          vr.style.transition   = 'transform 2s ease';
          vr.style.transform    = 'scaleY(1)';

          // slow continuous scale — matches Scene1's 7s linear drift
          lockup.style.transition = `opacity 0.6s ${EASE}, transform 7s linear`;
          lockup.style.opacity    = '1';
          lockup.style.transform  = 'scale(1.06)';
        }, 400);

        // 500ms — icon emerges from blur
        setTimeout(() => {
          iconWrap.style.transition = `opacity 1.2s ${EASE}, filter 1.2s ${EASE}, transform 1.2s ${EASE}`;
          iconWrap.style.opacity    = '1';
          iconWrap.style.filter     = 'blur(0px)';
          iconWrap.style.transform  = 'scale(1) translateY(0)';
        }, 500);

        // 1500ms — ONEX stagger in (55 ms per char, matches Scene1)
        onexChars.forEach((c, i) => charIn(c, 1500 + i * 55));

        // 2000ms — GLOBAL stagger in (50 ms per char)
        globalChars.forEach((c, i) => charIn(c, 2000 + i * 50));

        // 2800ms — footer fades in
        setTimeout(() => {
          footer.style.transition = 'opacity 1.1s ease';
          footer.style.opacity    = '1';
        }, 2800);

        // 5800ms — outro: text exits
        onexChars.forEach((c, i)   => charOut(c, 5800 + i * 20));
        globalChars.forEach((c, i) => charOut(c, 5800 + i * 18));
        setTimeout(() => {
          footer.style.transition = 'opacity 0.6s ease';
          footer.style.opacity    = '0';
        }, 5800);

        // 6200ms — icon + environment fade out
        setTimeout(() => {
          iconWrap.style.transition = 'opacity 0.6s ease, filter 0.6s ease, transform 0.6s ease';
          iconWrap.style.opacity    = '0';
          iconWrap.style.filter     = 'blur(20px)';
          iconWrap.style.transform  = 'scale(0.9) translateY(-1vw)';

          glow.style.transition   = 'opacity 0.8s ease';
          glow.style.opacity      = '0';
          grid.style.transition   = 'opacity 0.8s ease';
          grid.style.opacity      = '0';

          vl.style.transition     = 'transform 0.8s ease';
          vl.style.transform      = 'scaleY(0)';
          vr.style.transition     = 'transform 0.8s ease';
          vr.style.transform      = 'scaleY(0)';

          lockup.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
          lockup.style.opacity    = '0';
          lockup.style.transform  = 'scale(0.95)';
        }, 6200);

      }));
    }

    runLoop();
    setInterval(runLoop, LOOP);
  </script>
</body>
</html>
