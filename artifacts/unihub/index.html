<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONEX GLOBAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #080808;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Ambient glow ── */
    #glow {
      position: absolute;
      width: 70vw; height: 70vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.055) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.8s ease, transform 5s ease;
    }

    /* ── Grid texture ── */
    #grid {
      position: absolute; inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.18) 1px, transparent 1px);
      background-size: 4vw 4vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2s ease;
    }

    /* ── Cinematic border lines ── */
    .vline {
      position: absolute; top: 0; bottom: 0;
      width: 1px;
      background: rgba(255,255,255,0.06);
      transform: scaleY(0);
      transition: transform 2s ease;
    }
    #vl { left: 4vw; transform-origin: top center; }
    #vr { right: 4vw; transform-origin: bottom center; }

    /* ── Lockup ── */
    #lockup {
      position: relative; z-index: 10;
      display: flex; align-items: center; gap: 2.2vw;
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 1.2s ease, transform 7s linear;
    }

    /* ── SVG icon ── */
    #icon-wrap {
      width: 12vw; height: 9.5vw; flex-shrink: 0;
      opacity: 0;
      filter: blur(14px);
      transform: scale(0.82);
      transition: opacity 1.2s ease, filter 1.2s ease, transform 1.2s cubic-bezier(0.16,1,0.3,1);
    }

    /* ── Divider ── */
    #divider {
      width: 1.5px; height: 6vw; flex-shrink: 0;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
      transform: scaleY(0);
      transform-origin: center top;
      transition: transform 0.55s cubic-bezier(0.16,1,0.3,1);
    }

    /* ── Text block ── */
    #text-block {
      display: flex; flex-direction: column;
      line-height: 1.18; gap: 0.3vw;
    }

    .brand-line {
      color: white;
      display: block;
      opacity: 0;
      transform: translateX(-1.2vw);
      filter: blur(6px);
      transition: opacity 0.85s ease, transform 0.85s ease, filter 0.85s ease;
    }
    #line-onex   { font-size: clamp(22px, 3.6vw, 56px); font-weight: 900; letter-spacing: 0.07em; }
    #line-global { font-size: clamp(14px, 2.2vw, 34px); font-weight: 400; letter-spacing: 0.22em; }

    /* ── Footer ── */
    #footer {
      position: absolute;
      bottom: clamp(18px, 3.2vh, 40px);
      left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 clamp(20px, 4.4vw, 60px);
      opacity: 0;
      transition: opacity 1.1s ease;
    }
    #footer span {
      color: rgba(255,255,255,0.28);
      font-size: clamp(8px, 1.1vw, 14px);
      letter-spacing: 0.12em;
    }

    /* ── Character stagger spans (ONEX & GLOBAL) ── */
    .char {
      display: inline-block;
      opacity: 0;
      transform: translateY(100%) rotateX(90deg);
      transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1),
                  transform 0.8s cubic-bezier(0.16,1,0.3,1);
    }
    .char.in { opacity: 1; transform: translateY(0) rotateX(0deg); }
    .char.out { opacity: 0; transform: translateY(-100%) rotateX(-90deg); transition-duration: 0.35s; }

    /* ── Outro ── */
    .fade-out {
      opacity: 0 !important;
      filter: blur(14px) !important;
      transform: scale(0.92) !important;
      transition-duration: 0.6s !important;
    }
  </style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="grid"></div>
  <div class="vline" id="vl"></div>
  <div class="vline" id="vr"></div>

  <div id="lockup">
    <!-- SVG icon (sun + book) -->
    <div id="icon-wrap">
      <svg viewBox="0 0 128 105" fill="none" xmlns="http://www.w3.org/2000/svg"
           style="width:100%;height:100%">
        <!-- Book page arcs -->
        <path d="M 3 96 Q 36 92 64 88" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 125 96 Q 92 92 64 88" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 3 83 Q 36 79 64 75" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 125 83 Q 92 79 64 75" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 3 70 Q 36 66 64 62" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <path d="M 125 70 Q 92 66 64 62" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
        <!-- Sun circle -->
        <circle cx="64" cy="44" r="7.5" fill="white"/>
        <!-- Rays -->
        <line x1="64" y1="31" x2="64" y2="17" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="74" y1="34" x2="86" y2="23" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="78" y1="44" x2="93" y2="44" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="74" y1="54" x2="86" y2="65" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="54" y1="34" x2="42" y2="23" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="50" y1="44" x2="35" y2="44" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="54" y1="54" x2="42" y2="65" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="70" y1="32" x2="75" y2="17" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="58" y1="32" x2="53" y2="17" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Divider -->
    <div id="divider"></div>

    <!-- Brand name -->
    <div id="text-block">
      <span class="brand-line" id="line-onex"></span>
      <span class="brand-line" id="line-global"></span>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer">
    <span>ONEX GLOBAL</span>
    <span>2025 – 2026</span>
  </div>
</div>

<script>
  // Build character spans
  function buildChars(el, text) {
    el.innerHTML = text.split('').map((c, i) =>
      `<span class="char" data-i="${i}">${c === ' ' ? '&nbsp;' : c}</span>`
    ).join('');
    return el.querySelectorAll('.char');
  }

  const onexChars  = buildChars(document.getElementById('line-onex'),   'ONEX');
  const globalChars = buildChars(document.getElementById('line-global'), 'GLOBAL');

  const LOOP_MS = 7200; // total loop duration

  function runLoop() {
    // reset everything instantly
    document.getElementById('glow').style.opacity = '0';
    document.getElementById('glow').style.transform = 'translate(-50%,-50%) scale(0.6)';
    document.getElementById('grid').style.opacity = '0';
    document.getElementById('vl').style.transform = 'scaleY(0)';
    document.getElementById('vr').style.transform = 'scaleY(0)';
    document.getElementById('lockup').style.opacity = '0';
    document.getElementById('lockup').style.transform = 'scale(0.94)';
    document.getElementById('icon-wrap').style.opacity = '0';
    document.getElementById('icon-wrap').style.filter = 'blur(14px)';
    document.getElementById('icon-wrap').style.transform = 'scale(0.82)';
    document.getElementById('divider').style.transform = 'scaleY(0)';
    document.getElementById('line-onex').style.opacity = '0';
    document.getElementById('line-global').style.opacity = '0';
    document.getElementById('footer').style.opacity = '0';
    [...onexChars, ...globalChars].forEach(c => { c.classList.remove('in','out'); });

    // Disable transitions briefly for hard reset
    const all = document.querySelectorAll('[style]');
    all.forEach(el => el.style.transition = 'none');

    setTimeout(() => {
      // Re-enable transitions
      all.forEach(el => el.style.transition = '');

      // 0.4s — glow + lockup container
      setTimeout(() => {
        const g = document.getElementById('glow');
        g.style.opacity = '0.9';
        g.style.transform = 'translate(-50%,-50%) scale(1.3)';
        document.getElementById('grid').style.opacity = '1';
        document.getElementById('vl').style.transform = 'scaleY(1)';
        document.getElementById('vr').style.transform = 'scaleY(1)';
        const l = document.getElementById('lockup');
        l.style.opacity = '1';
        l.style.transform = 'scale(1.06)';
      }, 400);

      // 0.5s — icon emerges
      setTimeout(() => {
        const iw = document.getElementById('icon-wrap');
        iw.style.opacity = '1';
        iw.style.filter = 'blur(0px)';
        iw.style.transform = 'scale(1)';
      }, 500);

      // 1.5s — ONEX chars stagger in
      setTimeout(() => {
        onexChars.forEach((c, i) => {
          setTimeout(() => c.classList.add('in'), i * 55);
        });
        document.getElementById('line-onex').style.opacity = '1';
      }, 1500);

      // 1.9s — divider
      setTimeout(() => {
        document.getElementById('divider').style.transform = 'scaleY(1)';
      }, 1900);

      // 2.1s — GLOBAL chars stagger in
      setTimeout(() => {
        document.getElementById('line-global').style.opacity = '1';
        globalChars.forEach((c, i) => {
          setTimeout(() => c.classList.add('in'), i * 50);
        });
      }, 2100);

      // 2.9s — footer
      setTimeout(() => {
        document.getElementById('footer').style.opacity = '1';
      }, 2900);

      // 5.9s — outro: chars exit, then elements fade
      setTimeout(() => {
        [...onexChars, ...globalChars].forEach(c => {
          c.classList.remove('in');
          c.classList.add('out');
        });
        document.getElementById('footer').style.opacity = '0';
      }, 5900);

      setTimeout(() => {
        document.getElementById('icon-wrap').classList.add('fade-out');
        document.getElementById('divider').style.transform = 'scaleY(0)';
        document.getElementById('glow').style.opacity = '0';
        document.getElementById('grid').style.opacity = '0';
        document.getElementById('vl').style.transform = 'scaleY(0)';
        document.getElementById('vr').style.transform = 'scaleY(0)';
      }, 6300);

    }, 50);
  }

  // Kick off and loop
  runLoop();
  setInterval(runLoop, LOOP_MS);
</script>
</body>
</html>
