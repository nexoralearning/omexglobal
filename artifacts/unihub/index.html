<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONEX GLOBAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #090909;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }

    #stage {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ── Ambient glow ── */
    #glow {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04) 0%, transparent 62%);
      opacity: 0;
      pointer-events: none;
      will-change: opacity;
    }

    /* ── Main lockup: icon + divider + text side-by-side ── */
    #lockup {
      display: flex;
      align-items: center;
      gap: 28px;
      opacity: 1; /* lockup itself stays; children animate */
    }

    /* ── Icon SVG wrapper ── */
    #icon-wrap {
      width: 118px; height: 96px;
      flex-shrink: 0;
      transform-origin: center center;
      /* initial: compressed + invisible */
      transform: scaleX(0.35);
      opacity: 0;
      will-change: transform, opacity;
    }

    #icon-wrap svg {
      width: 100%; height: 100%;
      overflow: visible;
    }

    /* ── SVG animated groups ── */
    .arc-row {
      will-change: transform, opacity;
    }

    .sun-group {
      will-change: transform, opacity;
    }

    .ray-line {
      will-change: opacity;
    }

    /* ── Vertical divider ── */
    #divider {
      width: 1.5px; height: 60px;
      background: rgba(255,255,255,0.22);
      border-radius: 2px;
      transform-origin: center top;
      transform: scaleY(0);
      opacity: 0;
      will-change: transform, opacity;
    }

    /* ── Text block ── */
    #text-block {
      display: flex;
      flex-direction: column;
      line-height: 1.18;
      gap: 3px;
    }

    #onex {
      display: block;
      color: white;
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 0.07em;
      opacity: 0;
      transform: translateX(-14px);
      filter: blur(6px);
      will-change: opacity, transform, filter;
    }

    #global {
      display: block;
      color: white;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.22em;
      opacity: 0;
      transform: translateX(-14px);
      filter: blur(6px);
      will-change: opacity, transform, filter;
    }

    /* ── Footer ── */
    #footer {
      position: absolute;
      bottom: 32px; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 44px;
      opacity: 0;
      will-change: opacity;
    }
    #footer span {
      color: rgba(255,255,255,0.28);
      font-size: 11px;
      letter-spacing: 0.12em;
      font-weight: 400;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="glow"></div>

    <div id="lockup">
      <!-- ── Animated SVG icon ── -->
      <div id="icon-wrap">
        <!--
          viewBox 0 0 128 105
          Sun centre: SX=64, SY=44
          3 arc rows (bottom→top): yBase 96/83/70, yMid 88/75/62
          9 rays fanning 150° (−75° → +75°)
        -->
        <svg viewBox="0 0 128 105" fill="none" xmlns="http://www.w3.org/2000/svg">

          <!-- Row 0: bottom arcs (no offset — always visible base) -->
          <g class="arc-row" id="arc0">
            <path d="M 3 96 Q 36 92 64 88" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
            <path d="M 125 96 Q 92 92 64 88" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Row 1: middle arcs -->
          <g class="arc-row" id="arc1">
            <path d="M 3 83 Q 36 79 64 75" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
            <path d="M 125 83 Q 92 79 64 75" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Row 2: top arcs -->
          <g class="arc-row" id="arc2">
            <path d="M 3 70 Q 36 66 64 62" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
            <path d="M 125 70 Q 92 66 64 62" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
          </g>

          <!-- Sun circle (wrapped in g for translateY animation) -->
          <g class="sun-group" id="sun-g">
            <circle cx="64" cy="44" r="7.5" fill="white"/>
          </g>

          <!-- 9 sun rays (pre-calculated endpoints) -->
          <line class="ray-line" id="ray0" x1="51.44" y1="40.64" x2="25.36" y2="33.65" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          <line class="ray-line" id="ray1" x1="53.19" y1="36.78" x2="30.74" y2="21.78" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          <line class="ray-line" id="ray2" x1="56.09" y1="33.69" x2="39.65" y2="12.27" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          <line class="ray-line" id="ray3" x1="59.82" y1="31.69" x2="51.14" y2="6.12"  stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          <line class="ray-line" id="ray4" x1="64.00" y1="31.00" x2="64.00" y2="4.00"  stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          <line class="ray-line" id="ray5" x1="68.18" y1="31.69" x2="76.86" y2="6.12"  stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          <line class="ray-line" id="ray6" x1="71.91" y1="33.69" x2="88.35" y2="12.27" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          <line class="ray-line" id="ray7" x1="74.81" y1="36.78" x2="97.26" y2="21.78" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
          <line class="ray-line" id="ray8" x1="76.56" y1="40.64" x2="102.64" y2="33.65" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- ── Vertical divider ── -->
      <div id="divider"></div>

      <!-- ── Brand text ── -->
      <div id="text-block">
        <span id="onex">ONEX</span>
        <span id="global">GLOBAL</span>
      </div>
    </div>

    <!-- ── Footer ── -->
    <div id="footer">
      <span>ONEX GLOBAL</span>
      <span>2025 – 2026</span>
    </div>
  </div>

  <script>
    const E1 = 'cubic-bezier(0.22, 1, 0.36, 1)'; // snappy spring (icon open)
    const E2 = 'cubic-bezier(0.16, 1, 0.3,  1)'; // smooth spring (text / sun)
    const LOOP = 7000; // full cycle ms

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const glow    = document.getElementById('glow');
    const iconW   = document.getElementById('icon-wrap');
    const arc0    = document.getElementById('arc0');
    const arc1    = document.getElementById('arc1');
    const arc2    = document.getElementById('arc2');
    const sunG    = document.getElementById('sun-g');
    const divider = document.getElementById('divider');
    const onex    = document.getElementById('onex');
    const global_ = document.getElementById('global');
    const footer  = document.getElementById('footer');
    const rays    = [0,1,2,3,4,5,6,7,8].map(i => document.getElementById('ray'+i));
    // ray distance from center (ray 4 = centre = dist 0)
    const rayDist = [4,3,2,1,0,1,2,3,4];

    // ── Reset to initial hidden state ─────────────────────────────────────────
    function reset() {
      const none = 'none';

      glow.style.transition    = none;
      glow.style.opacity       = '0';

      iconW.style.transition   = none;
      iconW.style.transform    = 'scaleX(0.35)';
      iconW.style.opacity      = '0';

      // arcs: row 0 stays, rows 1+2 start offset+invisible
      arc0.style.transition    = none;
      arc0.style.transform     = 'translateY(0)';
      arc0.style.opacity       = '1';

      arc1.style.transition    = none;
      arc1.style.transform     = 'translateY(13px)';
      arc1.style.opacity       = '0';

      arc2.style.transition    = none;
      arc2.style.transform     = 'translateY(26px)';
      arc2.style.opacity       = '0';

      sunG.style.transition    = none;
      sunG.style.transform     = 'translateY(16px)';
      sunG.style.opacity       = '0';

      rays.forEach(r => {
        r.style.transition     = none;
        r.style.opacity        = '0';
      });

      divider.style.transition = none;
      divider.style.transform  = 'scaleY(0)';
      divider.style.opacity    = '0';

      onex.style.transition    = none;
      onex.style.opacity       = '0';
      onex.style.transform     = 'translateX(-14px)';
      onex.style.filter        = 'blur(6px)';

      global_.style.transition = none;
      global_.style.opacity    = '0';
      global_.style.transform  = 'translateX(-14px)';
      global_.style.filter     = 'blur(6px)';

      footer.style.transition  = none;
      footer.style.opacity     = '0';
    }

    // ── One full intro → hold → outro cycle ──────────────────────────────────
    function runLoop() {
      reset();

      // Double rAF: let transition:none paint before re-adding transitions
      requestAnimationFrame(() => requestAnimationFrame(() => {

        // ── INTRO ─────────────────────────────────────────────────────────

        // t=0ms — icon wrapper opens (scaleX book-open effect)
        iconW.style.transition = `transform 0.9s ${E1}, opacity 0.9s ${E1}`;
        iconW.style.transform  = 'scaleX(1)';
        iconW.style.opacity    = '1';

        // t=50ms — bottom arc (row 0) is already visible; rows 1+2 spread upward
        setTimeout(() => {
          arc1.style.transition = `transform 0.75s ${E1} 0s, opacity 0.45s ${E2} 0s`;
          arc1.style.transform  = 'translateY(0)';
          arc1.style.opacity    = '1';
        }, 170);

        setTimeout(() => {
          arc2.style.transition = `transform 0.75s ${E1} 0s, opacity 0.45s ${E2} 0s`;
          arc2.style.transform  = 'translateY(0)';
          arc2.style.opacity    = '1';
        }, 290);

        // t=420ms — sun rises
        setTimeout(() => {
          sunG.style.transition = `transform 0.55s ${E2}, opacity 0.55s ${E2}`;
          sunG.style.transform  = 'translateY(0)';
          sunG.style.opacity    = '1';
        }, 420);

        // t=520–720ms — rays fan out (centre first, edges last)
        rays.forEach((ray, i) => {
          const delay = Math.round((0.52 + rayDist[i] * 0.05) * 1000);
          setTimeout(() => {
            ray.style.transition = `opacity 0.38s ${E2}`;
            ray.style.opacity    = '1';
          }, delay);
        });

        // t=820ms — divider draws in
        setTimeout(() => {
          divider.style.transition = `transform 0.55s ${E2}, opacity 0.55s ${E2}`;
          divider.style.transform  = 'scaleY(1)';
          divider.style.opacity    = '1';
        }, 820);

        // t=820ms — ONEX slides in from left
        setTimeout(() => {
          onex.style.transition = `opacity 0.85s ${E2}, transform 0.85s ${E2}, filter 0.85s ${E2}`;
          onex.style.opacity    = '1';
          onex.style.transform  = 'translateX(0)';
          onex.style.filter     = 'blur(0px)';
        }, 820);

        // t=950ms — GLOBAL slides in
        setTimeout(() => {
          global_.style.transition = `opacity 0.85s ${E2}, transform 0.85s ${E2}, filter 0.85s ${E2}`;
          global_.style.opacity    = '1';
          global_.style.transform  = 'translateX(0)';
          global_.style.filter     = 'blur(0px)';
        }, 950);

        // t=1200ms — ambient glow blooms
        setTimeout(() => {
          glow.style.transition = 'opacity 2.5s ease';
          glow.style.opacity    = '1';
        }, 1200);

        // t=1600ms — footer fades in
        setTimeout(() => {
          footer.style.transition = 'opacity 1.1s ease';
          footer.style.opacity    = '1';
        }, 1600);

        // ── OUTRO (t=5400ms) ──────────────────────────────────────────────

        const OUT = 'ease';

        // rays fade first
        setTimeout(() => {
          rays.forEach(ray => {
            ray.style.transition = `opacity 0.4s ${OUT}`;
            ray.style.opacity    = '0';
          });
        }, 5400);

        // sun + arcs collapse
        setTimeout(() => {
          sunG.style.transition = `transform 0.5s ${OUT}, opacity 0.5s ${OUT}`;
          sunG.style.transform  = 'translateY(16px)';
          sunG.style.opacity    = '0';

          arc2.style.transition = `transform 0.5s ${OUT}, opacity 0.4s ${OUT}`;
          arc2.style.transform  = 'translateY(26px)';
          arc2.style.opacity    = '0';

          arc1.style.transition = `transform 0.5s ${OUT}, opacity 0.4s ${OUT}`;
          arc1.style.transform  = 'translateY(13px)';
          arc1.style.opacity    = '0';
        }, 5550);

        // text + divider exit
        setTimeout(() => {
          onex.style.transition    = `opacity 0.5s ${OUT}, transform 0.5s ${OUT}, filter 0.5s ${OUT}`;
          onex.style.opacity       = '0';
          onex.style.transform     = 'translateX(-10px)';
          onex.style.filter        = 'blur(4px)';

          global_.style.transition = `opacity 0.5s ${OUT}, transform 0.5s ${OUT}, filter 0.5s ${OUT}`;
          global_.style.opacity    = '0';
          global_.style.transform  = 'translateX(-10px)';
          global_.style.filter     = 'blur(4px)';

          divider.style.transition = `transform 0.4s ${OUT}, opacity 0.4s ${OUT}`;
          divider.style.transform  = 'scaleY(0)';
          divider.style.opacity    = '0';

          footer.style.transition  = `opacity 0.5s ${OUT}`;
          footer.style.opacity     = '0';
        }, 5600);

        // icon closes + glow dims
        setTimeout(() => {
          iconW.style.transition = `transform 0.6s ${OUT}, opacity 0.6s ${OUT}`;
          iconW.style.transform  = 'scaleX(0.35)';
          iconW.style.opacity    = '0';

          glow.style.transition  = 'opacity 0.8s ease';
          glow.style.opacity     = '0';
        }, 5900);

      }));
    }

    runLoop();
    setInterval(runLoop, LOOP);
  </script>
</body>
</html>
